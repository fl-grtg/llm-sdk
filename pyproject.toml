[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sdk-py"
version = "2.1.0"
description = "Small, clean Python SDK for OpenAI-compatible LLM APIs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Florian Gaertig" }
]
keywords = ["llm", "openai", "llm-sdk", "lm-studio", "chat-completions", "responses-api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0.0,<3",
]

[project.optional-dependencies]
pillow = [
    "pillow>=10.0.0,<13",
]
dev = [
    "ruff>=0.15,<1",
    "pytest>=9,<10",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/fl-grtg/llm-sdk"
Repository = "https://github.com/fl-grtg/llm-sdk"

[tool.setuptools]
py-modules = ["llm_sdk"]

[tool.pytest.ini_options]
markers = ["live: opt-in tests against configured real inference endpoints"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
